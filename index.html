<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7"><link rel="manifest" href="manifest.json">
<title>QR通信 v0.4</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f5f7;color:#111}
header{height:56px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;background:#fff;border-bottom:1px solid #ddd;position:relative}
header button{position:absolute;left:10px}.page{display:none;padding:18px;max-width:720px;margin:auto}.page.active{display:block}
.home{padding-top:14vh}.big{display:block;width:100%;font-size:28px;font-weight:700;padding:24px;margin:20px 0;border:0;border-radius:18px;background:#fff;box-shadow:0 2px 12px #0001}
button{font:inherit;border:1px solid #bbb;border-radius:12px;background:#fff;padding:11px 15px}.primary{background:#111;color:#fff;border-color:#111}
textarea{width:100%;min-height:220px;font-size:18px;padding:14px;border:1px solid #bbb;border-radius:14px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.row>*{flex:1}.muted{color:#666;font-size:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0}
#qrCanvas{display:block;max-width:min(88vw,520px);width:100%;height:auto;margin:18px auto;background:#fff}
video{width:100%;max-height:58vh;background:#111;border-radius:14px;object-fit:cover}.status{text-align:center;font-size:18px;margin:12px}.progress{height:10px;background:#ddd;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#111;width:0}
select,input[type=number]{font:inherit;padding:10px;border-radius:10px;border:1px solid #bbb}
.hidden{display:none!important}

.autoControlWrap{margin:12px 0 10px;width:100%}
.autoControlWrap button{display:block;width:100%;min-height:76px;font-size:26px;font-weight:700;border-radius:16px}
.manualControls{display:flex;justify-content:center;gap:12px;margin:8px 0 12px}
.manualControls button{min-width:78px;min-height:46px;font-size:20px;font-weight:600;border-radius:10px}
.endButton{display:block;width:100%;min-height:52px;margin-top:10px;font-size:20px;font-weight:700;border-radius:12px}


#cameraFrame{
  width:min(92vw,560px);
  aspect-ratio:1/1;
  margin:10px auto;
  overflow:hidden;
  border-radius:16px;
  background:#000;
  position:relative;
}
#cameraFrame video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
#cameraGuide{
  position:absolute;
  inset:0;
  border:4px solid rgba(255,255,255,.85);
  border-radius:16px;
  pointer-events:none;
  box-sizing:border-box;
}


:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--sub:#667085;--accent:#1769e0;--line:#dfe5ec}
html,body{background:var(--bg);color:var(--text)}
body{max-width:680px;margin:0 auto;padding:0 14px 28px}
.page{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 3px 16px rgba(0,0,0,.05)}
h1{font-size:30px;margin:20px 0 16px} h2{font-size:21px}
button{border-radius:14px;font-weight:700}
#home button{min-height:70px;font-size:24px}
#sendStatus,#recvStatus{font-size:30px;font-weight:800;margin:4px 0 10px}
#qrCanvas{display:block;width:min(92vw,560px)!important;height:auto!important;margin:0 auto;background:#fff;border-radius:12px}
#autoToggle{background:var(--accent);color:#fff;border:none;min-height:76px;font-size:26px}
.manualControls button{min-width:78px}
.endButton{margin-top:16px;min-height:48px!important}
.muted{color:var(--sub);line-height:1.45}
#cameraFrame{width:min(92vw,560px);aspect-ratio:1/1;margin:10px auto 14px;overflow:hidden;border-radius:18px;background:#111;position:relative;box-shadow:0 3px 16px rgba(0,0,0,.12)}
#cameraGuide{position:absolute;inset:10px;border:3px solid rgba(255,255,255,.9);border-radius:14px;pointer-events:none;box-sizing:border-box}
.settingsGroup{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
#diagBox{background:#f7f9fb;border:1px solid var(--line);border-radius:14px;padding:12px;font-variant-numeric:tabular-nums;line-height:1.7}
</style>
<style>
html,body{touch-action:manipulation;overscroll-behavior:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.blockStatus{display:flex;align-items:baseline;justify-content:center;gap:.35em;margin:.3em 0 .5em;font-weight:700}
.blockStatus .label{font-size:20px}
.blockStatus .current{font-size:42px;line-height:1}
.blockStatus .total{font-size:26px}
.transferControls{display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr;gap:8px;margin:14px 0}
.transferControls button{min-height:72px;font-size:26px;font-weight:700;border-radius:14px;padding:0 8px}
#autoToggle{font-size:22px}
#receiveBlockStatus{margin-top:10px}
</style>

</head>
<body>
<header><button id="back" class="hidden">＜ 戻る</button><span id="title">QR通信</span></header>
<main>
<section id="home" class="page active home">
<button class="big" data-go="send">送る</button><button class="big" data-go="receive">受ける</button>
<button style="float:right" data-go="settings">⚙︎ 設定</button>
</section>
<section id="send" class="page">
<textarea id="text" placeholder="ここに文章を入力 または貼り付け"></textarea>
<div class="row"><button id="fileBtn">ファイルを開く</button><input id="file" type="file" hidden></div>
<div id="fileInfo" class="muted"></div>
<div class="row"><button id="normalQR">通常QRを表示</button><button id="commQR" class="primary">QR通信で送る</button></div>
</section>
<section id="show" class="page">
<div id="sendStatus" class="status"></div>
<canvas id="qrCanvas" width="600" height="600"></canvas>
<div id="waitText" class="status"></div>
<div class="autoControlWrap">
  <button id="autoToggle">▶ 自動送信</button>
</div>
<div class="manualControls">
  <button id="back10">−10</button>
  <button id="prev">←</button>
  <button id="next">→</button>
</div>
<button id="end" class="endButton">終了</button>
<div class="muted">自動送信間隔とPayloadサイズは設定で変更できます。読み損なった場合は停止し、−10 / ← で戻して再開できます。</div>
</section>
<section id="receive" class="page">
<div id="cameraFrame"><video id="video" playsinline></video><div id="cameraGuide"></div></div><canvas id="scanCanvas" hidden></canvas>
<div id="receiveBlockStatus" class="blockStatus hidden"></div><div id="recvStatus" class="status">QRコードを映してください</div>
<div class="progress"><div id="bar"></div></div>
<div id="result" class="card hidden"></div>
<div class="row"><button id="copy" class="hidden">コピー</button><button id="save" class="hidden">ファイル保存</button><button id="stop">閉じる</button></div>
</section>
<section id="settings" class="page">
<div class="card">
  <label>ブロックサイズ　
    <select id="block">
      <option>64</option><option>128</option><option>256</option><option selected>512</option><option>768</option><option>1024</option>
    </select> B
  </label>
</div>
<div class="card">
  <label>自動送信間隔　
    <select id="autoInterval">
      <option value="100">0.1秒</option>
      <option value="200" selected>0.2秒</option>
      <option value="300">0.3秒</option>
      <option value="400">0.4秒</option>
      <option value="500">0.5秒</option>
      <option value="1000">1.0秒</option>
    </select>
  </label>
</div>
<div class="card">
  <label>誤り訂正　
    <select id="ecc">
      <option>L</option><option selected>M</option><option>Q</option><option>H</option>
    </select>
  </label>
  <p class="muted">高くすると読み取り耐性が上がりますが、QRコードが高密度になります。</p>
</div>
<div class="card"><b>プロトコル</b><p class="muted">Start Magic 4B / Version 1B / Type 1B / Total 1B / Block 1B<br>継続: Short Magic 2B / Block 1B</p></div>
<div class="settingsGroup"><h3>診断</h3><div id="diagBox"><div>画面更新: <span id="displayDiag">未測定</span></div><div>カメラ: <span id="cameraDiag">受信画面で測定</span></div></div><button id="measureDisplay" type="button">画面周期を測定</button><div class="muted">ブラウザから見た実効周期です。</div></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script src="app.js"></script>
</body></html>
